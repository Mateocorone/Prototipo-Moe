<body>
<div class="ambient"></div>
<main class="stage">
  <section class="phone" aria-label="Prototipo del asistente Moe">
    <div class="app closed" id="app">
      <header class="top">
        <button class="back" id="back" aria-label="Cerrar chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
        <div class="brand"><div class="mini-orb"><i></i></div><div><strong>Moe</strong><span>En línea · responde al instante</span></div></div>
        <div class="actions">
          <button class="icon-btn" id="mute" aria-label="Silenciar sonidos"></button>
          <button class="icon-btn" id="customize" aria-label="Personalizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button class="icon-btn" id="close" aria-label="Cerrar chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
      </header>
      <div class="chat" id="chat" aria-live="polite"></div>
      <form class="composer" id="composer"><input id="freeText" aria-label="Escribe un mensaje" placeholder="Escribe tu mensaje…" autocomplete="off"><button class="send" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m4 4 17 8-17 8 3-8-3-8Z"/><path d="M7 12h14"/></svg></button></form>
    </div>
    <aside class="settings" id="settings" aria-label="Personalización">
      <div class="settings-head"><div><small style="color:var(--accent);font-weight:800">TU MOE</small><h2>Personalización</h2></div><button class="icon-btn" id="closeSettings" aria-label="Cerrar ajustes">✕</button></div>
      <div class="setting"><label>Apariencia</label><div class="mode-picker"><button class="mode-btn light-mode" data-theme="light" aria-label="Modo claro"><span aria-hidden="true">☀</span></button><button class="mode-btn dark-mode" data-theme="dark" aria-label="Modo oscuro"><span aria-hidden="true">☾</span></button></div></div>
      <div class="setting"><label>Color de Moe</label><div class="palette" id="palette"></div></div>
      <div class="setting"><label><span>Sonidos</span><button class="toggle" id="soundToggle" aria-label="Activar sonidos"></button></label></div>
      <button class="primary secondary reset" id="resetPrefs">Restablecer apariencia</button>
    </aside>
    <div class="toast" id="toast" role="status"></div>
  </section>
</main>
<button class="launcher" id="launcher" aria-label="Abrir a Moe"><span class="ping"></span></button>
<script>
  const $=s=>document.querySelector(s), chat=$('#chat'), back=$('#back');
  const icons={volume:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></svg>',mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="m22 9-6 6M16 9l6 6"/></svg>'};
  const defaults={theme:'light',palette:'ocean',sound:true};
  let prefs={...defaults,...JSON.parse(localStorage.getItem('moe-prefs')||'{}')};
  let stack=[], screen='home', data={clientType:'',first:'',last:'',phone:'',email:'',service:'',cabin:'',extra:'',day:'',time:'',notes:''}, audioCtx, chatSession=0;
  const steps=['client','details','service','cabin','extra','day','time','notes','summary'];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function hexRgb(h){const n=parseInt(h.slice(1),16);return `${n>>16},${n>>8&255},${n&255}`}
  function savePrefs(){localStorage.setItem('moe-prefs',JSON.stringify(prefs))}
  function applyPrefs(){document.documentElement.dataset.theme=prefs.theme;document.documentElement.dataset.palette=prefs.palette;$('#mute').innerHTML=prefs.sound?icons.volume:icons.mute;$('#mute').setAttribute('aria-label',prefs.sound?'Silenciar sonidos':'Activar sonidos');$('#soundToggle').classList.toggle('on',prefs.sound)}
  function sound(type){if(!prefs.sound)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);let f=type==='send'?420:type==='receive'?650:type==='confirm'?520:type==='complete'?740:300;o.frequency.setValueAtTime(f,t);if(type==='complete')o.frequency.exponentialRampToValueAtTime(1180,t+.18);else o.frequency.exponentialRampToValueAtTime(f*1.25,t+.07);g.gain.setValueAtTime(type==='key'?.018:.04,t);g.gain.exponentialRampToValueAtTime(.001,t+(type==='complete'?.32:.1));o.start(t);o.stop(t+(type==='complete'?.33:.11))}catch(e){}}
  const timeNow=()=>new Intl.DateTimeFormat('es',{hour:'2-digit',minute:'2-digit'}).format(new Date());
  function escapeHtml(v=''){return v.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  function bubble(text,who='bot'){return `<div class="message ${who}"><div class="bubble"${who==='bot'?' data-typewrite="true"':''}>${text}<div class="time">${timeNow()}</div></div></div>`}
  function typeBubble(text){const session=chatSession;return new Promise(resolve=>{const el=document.createElement('div');el.className='message bot';el.innerHTML='<div class="bubble"><span></span><div class="time">'+timeNow()+'</div></div>';chat.append(el);const span=el.querySelector('span');if(reduce){span.textContent=text;sound('receive');scrollEnd();return resolve()}let i=0;const timer=setInterval(()=>{if(session!==chatSession){clearInterval(timer);return resolve()}span.textContent+=text[i++]||'';if(i%3===0)sound('key');scrollEnd();if(i>text.length){clearInterval(timer);sound('receive');resolve()}},18)})}
  function typing(){const el=document.createElement('div');el.className='message bot temp';el.innerHTML='<div class="bubble typing"><i></i><i></i><i></i></div>';chat.append(el);scrollEnd();return el}
  function botReply(text,delay=480){const session=chatSession,t=typing();return new Promise(r=>setTimeout(r,reduce?20:delay)).then(()=>{t.remove();if(session!==chatSession)return;return typeBubble(text)})}
  function scrollEnd(){requestAnimationFrame(()=>chat.scrollTop=chat.scrollHeight)}
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  async function animatePendingBubbles(){const session=chatSession,pending=[...chat.querySelectorAll('[data-typewrite="true"]')];for(const el of pending){el.removeAttribute('data-typewrite');const time=el.querySelector('.time')?.cloneNode(true),text=[...el.childNodes].filter(n=>!(n.nodeType===1&&n.classList.contains('time'))).map(n=>n.textContent).join('').trim();el.innerHTML='<span class="inline-typing"><i></i><i></i><i></i></span>';scrollEnd();await wait(reduce?20:520);if(session!==chatSession)return;const typed=document.createElement('span');el.replaceChildren(typed);if(time)el.append(time);if(reduce){typed.textContent=text}else{for(let i=0;i<text.length;i++){if(session!==chatSession)return;typed.textContent+=text[i];if(i%4===0)sound('key');if(i%3===0)scrollEnd();await wait(24)}}sound('receive');scrollEnd()}}
  function revealControls(){const controls=[...chat.querySelectorAll('.awaiting')];controls.forEach(el=>el.classList.remove('awaiting'));const options=controls.flatMap(el=>el.matches('.options')?[...el.querySelectorAll('.option')]:[]);options.forEach((el,i)=>{el.style.animation='none';void el.offsetWidth;el.style.animation=`stairIn .38s cubic-bezier(.2,.8,.2,1) ${i*90}ms both`});scrollEnd()}
  function option(label,sub='',value=label,ico='✦'){return `<button class="option" data-value="${escapeHtml(value)}"><span class="oi">${ico}</span><span><b>${label}</b>${sub?`<small>${sub}</small>`:''}</span><span class="arrow">›</span></button>`}
  function archiveControls(){chat.querySelectorAll('.options,.form,#confirm,[data-edit],[data-home],[data-menu]').forEach(el=>el.remove());if(screen==='complete')chat.querySelectorAll('.summary').forEach(el=>el.remove())}
  function setView(html,{hero=false}={}){if(hero){chat.innerHTML=`<div class="hero"><div class="orb"><span class="ring"></span><span class="ring"></span><div class="core"></div></div><h1>Hola, soy Moe.</h1><p>Tu asistente personal para verte y sentirte increíble.</p></div><div class="date">Hoy</div>`+html;requestAnimationFrame(()=>chat.scrollTop=0)}else{archiveControls();chat.insertAdjacentHTML('beforeend',html);scrollEnd()}const controls=[...chat.querySelectorAll('.options,.form,.summary,#confirm,[data-edit],[data-home],[data-menu],.celebrate')].filter(el=>!el.closest('.settings'));controls.forEach(el=>el.classList.add('awaiting'));animatePendingBubbles().then(revealControls);back.hidden=false}
  function go(next,push=true){if(push&&screen!==next)stack.push(screen);screen=next;render()}
  function choose(next,key,value,label=value){sound('send');data[key]=value;chat.insertAdjacentHTML('beforeend',bubble(escapeHtml(label),'user'));scrollEnd();setTimeout(()=>go(next),260)}
  function homeMenu(){return `<div class="options">${option('Nueva cita','Reserva en menos de 2 minutos','new','＋')}${option('Mis citas','Consulta próximas reservas','appointments','◷')}${option('Contactos','Tu equipo y especialistas','contacts','◎')}${option('Ayuda','Respuestas rápidas','help','?')}</div><div class="hint">Prototipo local · ningún dato se envía fuera del navegador.</div>`}
  function menuButton(){return '<button class="primary secondary menu-return" data-menu>← Volver al menú</button>'}
  function render(){back.hidden=false;$('#app').classList.toggle('success',screen==='complete');
    if(screen==='home')setView(bubble('¡Hola! Soy Moe. Puedo ayudarte a reservar, consultar tus citas o encontrar a alguien del equipo. ¿Qué hacemos?')+homeMenu(),{hero:true});
    else if(screen==='client')setView(bubble('Perfecto. Para comenzar, ¿ya eres cliente?')+`<div class="options">${option('Ya soy cliente','Usaremos tus datos guardados','existing','✓')}${option('Soy cliente nuevo','Te tomará menos de un minuto','new','＋')}</div>`);
    else if(screen==='details')setView(bubble(data.clientType==='existing'?'Confirma tus datos y seguimos.':'Encantado de conocerte. Cuéntame un poco sobre ti.')+`<form class="form" id="detailsForm"><div class="field"><label>Nombre</label><input name="first" value="${escapeHtml(data.first)}" autocomplete="given-name" required><span class="error">Escribe tu nombre</span></div><div class="field"><label>Apellidos</label><input name="last" value="${escapeHtml(data.last)}" autocomplete="family-name" required><span class="error">Escribe tus apellidos</span></div><div class="field"><label>Teléfono</label><div class="phone-field"><input name="prefix" value="+593" aria-label="Prefijo"><input name="phone" value="${escapeHtml(data.phone)}" inputmode="tel" autocomplete="tel" placeholder="99 123 4567" required></div><span class="error">Añade un teléfono válido</span></div><div class="field"><label>Email</label><input name="email" value="${escapeHtml(data.email)}" type="email" autocomplete="email" placeholder="tu@email.com" required><span class="error">Añade un email válido</span></div><button class="primary">Continuar</button></form>`);
    else if(screen==='service')setView(bubble(`Gracias${data.first?', '+escapeHtml(data.first):''}. ¿Qué servicio quieres reservar?`)+`<div class="options">${option('Peluquería','Corte, peinado o color','Peluquería','✂')}${option('Manicura','Cuidado y color para tus manos','Manicura','◇')}${option('Pedicure','Cuidado completo para tus pies','Pedicure','◒')}${option('Manicura + Pedicure','El combo completo','Manicura + Pedicure','✦')}</div>`);
    else if(screen==='cabin')setView(bubble('¿En qué cabina prefieres tu cita?')+`<div class="options">${option('Cabina Aura','Tranquila y luminosa','Aura','A')}${option('Cabina Nube','Íntima y relajante','Nube','N')}${option('Sin preferencia','Elegiremos la primera disponible','Cualquiera','∞')}</div>`);
    else if(screen==='extra')setView(bubble('¿Quieres añadir algo más a tu experiencia?')+`<div class="options">${option('Masaje capilar','15 min · $8','Masaje capilar','〜')}${option('Tratamiento nutritivo','20 min · $12','Tratamiento nutritivo','✦')}${option('Nada más','Continuar con la reserva','Ninguno','✓')}</div>`);
    else if(screen==='day')setView(bubble('¿Qué día te viene mejor?')+`<div class="options row2">${option('Hoy','Disponibilidad limitada','Hoy','☀')}${option('Mañana','Más horarios','Mañana','→')}</div>`);
    else if(screen==='time'){const list=['09:00','10:30','12:00','14:30','16:00','18:30'];setView(bubble(`Estos son los horarios disponibles para ${data.day.toLowerCase()}.`)+`<div class="options times">${list.map(t=>`<button class="option" data-value="${t}"><b>${t}</b></button>`).join('')}</div>`)}
    else if(screen==='notes')setView(bubble('Casi terminamos. ¿Hay algo que debamos saber?')+`<form class="form" id="notesForm"><div class="field"><label>Notas opcionales</label><textarea name="notes" placeholder="Ej.: prefiero esmalte nude, tengo alergia…">${escapeHtml(data.notes)}</textarea></div><button class="primary">Revisar reserva</button><button type="button" class="primary secondary" data-skip>Omitir</button></form>`);
    else if(screen==='summary')setView(bubble('Todo listo. Revisa los detalles antes de confirmar.')+summary()+`<button class="primary" id="confirm">Confirmar reserva</button><button class="primary secondary" style="margin-top:9px" data-edit>Editar detalles</button>`);
    else if(screen==='complete')setView(`<div class="celebrate"><div class="confetti">${Array.from({length:18},(_,i)=>`<i style="--c:${['var(--accent)','#fff','#ff78b7','#6be5ff'][i%4]};--r:${i*20}deg;--x:${Math.cos(i)*150}px;--y:${110+Math.random()*180}px"></i>`).join('')}</div><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 4 4L19 6"/></svg></div><h2>¡Reserva completada!</h2><p>Tu cita quedó confirmada. Te enviaremos un recordatorio antes de verte.</p></div>${summary(true)}<button class="primary" data-home>Volver al menú</button>`);
    else if(screen==='appointments')setView(bubble('Aquí tienes tus próximas citas.')+`<div class="section-title">Próxima</div><div class="summary"><div class="summary-head"><div class="cal"><strong>08</strong><small>oct</small></div><div><b>Manicura · Cabina Aura</b><small style="display:block;color:var(--muted);margin-top:4px">Mañana · 10:30</small></div></div><div class="ticket"><span>Estado</span><strong>Confirmada</strong></div></div><div class="section-title">Historial reciente</div><div class="contact"><div class="history-date"><strong>22</strong><small>sep</small></div><div class="meta"><b>Peluquería</b><small>22 septiembre · 16:00</small></div><span class="badge">Finalizada</span></div>${menuButton()}`);
    else if(screen==='contacts')setView(bubble('Estas son algunas personas del equipo. ¿Con quién quieres hablar?')+`<div class="section-title">Especialistas disponibles</div>${[['LR','Laura Ríos','Colorista · Disponible'],['MS','Marta Sol','Manicura · En cita'],['JV','José Vera','Estilista · Disponible']].map((c,i)=>`<button class="contact" style="width:100%;background:none;color:inherit;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer" data-contact="${c[1]}"><div class="avatar">${c[0]}</div><div class="meta"><b>${c[1]}</b><small>${c[2]}</small></div><span class="badge">${i===1?'15 min':'Ahora'}</span></button>`).join('')}${menuButton()}`);
    else if(screen==='help')setView(bubble('Estoy aquí para ayudarte. Elige una pregunta o escríbeme abajo.')+`<div class="options">${option('¿Cómo cambio mi cita?','','faq-change','↻')}${option('Política de cancelación','','faq-cancel','i')}${option('Métodos de pago','','faq-pay','$')}${option('Hablar con una persona','','faq-human','◎')}</div>${menuButton()}`);
    else if(screen==='menu')setView(bubble('¿Qué quieres hacer ahora?')+homeMenu());
    bind();
  }
  function summary(done=false){const offset=data.day==='Mañana'?86400000:0,d=new Date(Date.now()+offset),day=String(d.getDate()).padStart(2,'0'),month=new Intl.DateTimeFormat('es',{month:'short'}).format(d).replace('.','');return `<div class="summary"><div class="summary-head"><div class="cal" aria-label="${escapeHtml(data.day||'Mañana')}"><strong>${day}</strong><small>${month}</small></div><div><b>${escapeHtml(data.service||'Manicura')}</b><small style="display:block;color:var(--muted);margin-top:4px">${escapeHtml(data.day||'Mañana')} · ${escapeHtml(data.time||'10:30')}</small></div></div><dl><dt>Cliente</dt><dd>${escapeHtml((data.first+' '+data.last).trim()||'Valeria Andrade')}</dd><dt>Cabina</dt><dd>${escapeHtml(data.cabin||'Aura')}</dd><dt>Adicional</dt><dd>${escapeHtml(data.extra||'Ninguno')}</dd>${data.notes?`<dt>Notas</dt><dd>${escapeHtml(data.notes)}</dd>`:''}<dt>Duración</dt><dd>60 min</dd></dl>${done?`<div class="ticket"><span>Código</span><strong>MOE-2481</strong></div>`:''}</div>`}
  function bind(){chat.querySelectorAll('.option').forEach(btn=>btn.onclick=()=>handleOption(btn.dataset.value,btn.querySelector('b')?.textContent||btn.dataset.value));
    const f=$('#detailsForm');if(f)f.onsubmit=e=>{e.preventDefault();let ok=true;['first','last','phone','email'].forEach(n=>{const input=f.elements[n], valid=n==='email'?input.validity.valid:input.value.trim().length>1;input.closest('.field').classList.toggle('invalid',!valid);ok&&=valid});if(!ok)return sound('error');data.first=f.first.value.trim();data.last=f.last.value.trim();data.phone=f.prefix.value+' '+f.phone.value.trim();data.email=f.email.value.trim();chat.insertAdjacentHTML('beforeend',bubble(`Datos completados · ${escapeHtml(data.first+' '+data.last)}`,'user'));sound('send');go('service')};
    const nf=$('#notesForm');if(nf){nf.onsubmit=e=>{e.preventDefault();data.notes=nf.notes.value.trim();chat.insertAdjacentHTML('beforeend',bubble(escapeHtml(data.notes||'Sin notas'),'user'));sound('send');go('summary')};nf.querySelector('[data-skip]').onclick=()=>{data.notes='';chat.insertAdjacentHTML('beforeend',bubble('Sin notas','user'));sound('send');go('summary')}}
    const confirm=$('#confirm');if(confirm)confirm.onclick=()=>{chat.insertAdjacentHTML('beforeend',bubble('Confirmar reserva','user'));sound('confirm');confirm.disabled=true;confirm.textContent='Confirmando…';setTimeout(()=>{sound('complete');screen='complete';stack=[];render()},reduce?50:850)};
    chat.querySelector('[data-edit]')?.addEventListener('click',()=>{stack.push('summary');screen='service';render()});
    const returnToMenu=()=>{chat.insertAdjacentHTML('beforeend',bubble('Volver al menú','user'));sound('send');stack=[];screen='menu';render()};
    chat.querySelector('[data-home]')?.addEventListener('click',returnToMenu);chat.querySelector('[data-menu]')?.addEventListener('click',returnToMenu);
    chat.querySelectorAll('[data-contact]').forEach(b=>b.onclick=()=>{sound('button');toast(`${b.dataset.contact} ha recibido tu aviso`)});
  }
  function handleOption(v,label){if(screen==='home'||screen==='menu'){chat.insertAdjacentHTML('beforeend',bubble(escapeHtml(label),'user'));sound('send');if(v==='new')go('client');else go(v)}else if(screen==='client')choose('details','clientType',v,label);else if(screen==='service')choose('cabin','service',v,label);else if(screen==='cabin')choose('extra','cabin',v,label);else if(screen==='extra')choose('day','extra',v,label);else if(screen==='day')choose('time','day',v,label);else if(screen==='time')choose('notes','time',v,label);else if(screen==='help'){const replies={'faq-change':'Puedes cambiarla desde “Mis citas” hasta 4 horas antes.','faq-cancel':'La cancelación es gratuita hasta 4 horas antes de tu cita.','faq-pay':'Aceptamos efectivo, tarjeta y transferencia.','faq-human':'Claro. He avisado al equipo; alguien te responderá muy pronto.'};chat.insertAdjacentHTML('beforeend',bubble(escapeHtml(label),'user'));sound('send');botReply(replies[v])}}
  function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
  function closeChat(){sound('button');$('#app').classList.add('closed');$('#launcher').style.display='grid'}
  function resetChat(){chatSession++;conversationStarted=false;screen='home';stack=[];data={clientType:'',first:'',last:'',phone:'',email:'',service:'',cabin:'',extra:'',day:'',time:'',notes:''};$('#freeText').value='';$('#settings').classList.remove('open');$('#app').classList.remove('success');chat.replaceChildren();closeChat()}
  back.onclick=closeChat;
  $('#composer').onsubmit=e=>{e.preventDefault();const input=$('#freeText'),v=input.value.trim();if(!v)return;chat.insertAdjacentHTML('beforeend',bubble(escapeHtml(v),'user'));input.value='';sound('send');scrollEnd();botReply('Gracias por contármelo. Para esta demo, puedes usar las opciones de arriba o reservar una nueva cita desde el menú.')};
  $('#freeText').addEventListener('input',()=>sound('key'));
  $('#close').onclick=resetChat;
  let conversationStarted=false;
  $('#launcher').onclick=async()=>{const app=$('#app');app.classList.remove('closed');$('#launcher').style.display='none';sound('receive');if(conversationStarted){scrollEnd();return}conversationStarted=true;const session=++chatSession;app.classList.remove('success');screen='home';stack=[];data={};setView('',{hero:true});await botReply('¡Hola! Soy Moe. Estoy listo para que pruebes una reserva, consultes citas, abras contactos o explores la ayuda.');if(session!==chatSession)return;chat.insertAdjacentHTML('beforeend',homeMenu());const firstMenu=chat.querySelector('.options');firstMenu?.classList.add('awaiting');bind();requestAnimationFrame(revealControls)};
  $('#mute').onclick=()=>{prefs.sound=!prefs.sound;applyPrefs();savePrefs();if(prefs.sound)sound('button')};
  $('#customize').onclick=()=>{$('#settings').classList.add('open');sound('button')};$('#closeSettings').onclick=()=>$('#settings').classList.remove('open');
  const colors=[{id:'ocean',name:'Océano',c1:'#4054ff',c2:'#8290ff'},{id:'aqua',name:'Aqua',c1:'#008f95',c2:'#4ac9b6'},{id:'violet',name:'Violeta',c1:'#7c4de4',c2:'#bd71ee'},{id:'coral',name:'Coral',c1:'#e95378',c2:'#ff936e'}];$('#palette').innerHTML=colors.map(c=>`<button class="swatch" style="--c1:${c.c1};--c2:${c.c2}" data-color="${c.id}" aria-label="${c.name}" title="${c.name}"></button>`).join('');
  function syncSettings(){document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('active',x.dataset.color===prefs.palette));document.querySelectorAll('.mode-btn').forEach(x=>x.classList.toggle('active',x.dataset.theme===prefs.theme))}
  document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{prefs.palette=b.dataset.color;applyPrefs();syncSettings();savePrefs();sound('button')});
  document.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>{prefs.theme=b.dataset.theme;applyPrefs();syncSettings();savePrefs();sound('button')});
  $('#soundToggle').onclick=()=>{$('#mute').click();syncSettings()};$('#resetPrefs').onclick=()=>{prefs={...defaults};applyPrefs();syncSettings();savePrefs();toast('Apariencia restablecida')};
  applyPrefs();syncSettings();$('#launcher').style.display='grid';
</script>
</body>
</html>
